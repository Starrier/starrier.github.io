name: Deploy Hexo

# Only runs after changes land on master (e.g. PR merge).
# Pushes to feature/dev branches do NOT consume Actions minutes.
on:
  push:
    branches: [master]
    paths:
      - 'source/**'
      - 'themes/**'
      - '_config.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'gulpfile.js'
      - '.github/workflows/deploy.yml'
  workflow_dispatch: # manual run only when you click it in the Actions UI

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: development
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --include=dev --no-fund --no-audit

      - name: Generate site
        run: |
          node ./node_modules/hexo/bin/hexo generate
          test -f public/index.html

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: 'deploy: ${{ github.sha }}'
