name: Deploy Hexo

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      # Ensure devDependencies (e.g. historical gulp tooling) are installed if needed
      NODE_ENV: development
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --include=dev --no-fund --no-audit

      - name: Hexo clean
        run: node node_modules/hexo/bin/hexo clean

      - name: Hexo generate
        run: node node_modules/hexo/bin/hexo generate

      # Optional asset minify; keep non-blocking so a gulp/native dep issue cannot block deploy
      - name: Gulp minify
        continue-on-error: true
        run: node node_modules/gulp/bin/gulp.js

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: 'deploy: ${{ github.sha }}'
