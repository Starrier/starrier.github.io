name: Deploy Hexo

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Verify hexo toolchain
        run: |
          node -v
          npm -v
          test -f node_modules/hexo/bin/hexo
          test -d node_modules/hexo/node_modules/hexo-cli || test -d node_modules/hexo-cli
          ls -la node_modules/.bin/hexo node_modules/hexo/bin/hexo

      - name: Build site
        run: |
          node node_modules/hexo/bin/hexo clean
          node node_modules/hexo/bin/hexo generate
          node node_modules/gulp/bin/gulp.js

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: 'deploy: ${{ github.sha }}'
