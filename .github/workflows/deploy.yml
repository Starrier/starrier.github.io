name: Deploy Hexo

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --no-fund --no-audit

      - name: Debug toolchain
        run: |
          node -v
          npm -v
          ls -la node_modules/hexo/bin || true
          ls -la node_modules/.bin/hexo node_modules/.bin/gulp || true
          ls -la node_modules/hexo-cli || true
          ls node_modules/hexo/node_modules/hexo-cli || true

      - name: Build site
        run: |
          set -e
          HEXO_BIN="node_modules/hexo/bin/hexo"
          GULP_BIN="node_modules/gulp/bin/gulp.js"
          test -f "$HEXO_BIN"
          test -f "$GULP_BIN"
          node "$HEXO_BIN" clean
          node "$HEXO_BIN" generate
          node "$GULP_BIN"

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: 'deploy: ${{ github.sha }}'
