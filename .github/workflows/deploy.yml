name: Deploy Hexo

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: development
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --include=dev --no-fund --no-audit

      - name: Generate site
        id: generate
        continue-on-error: true
        run: |
          set +e
          node ./node_modules/hexo/bin/hexo version > gen.log 2>&1
          node ./node_modules/hexo/bin/hexo generate >> gen.log 2>&1
          HEXO_EXIT=$?
          echo "HEXO_EXIT:$HEXO_EXIT" | tee -a gen.log
          ls -la public >> gen.log 2>&1 || true
          cat gen.log
          exit $HEXO_EXIT

      - name: Publish build log on failure
        if: steps.generate.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('gen.log', 'utf8').slice(0, 60000);
            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: '### Hexo CI failure log\n\n```text\n' + log + '\n```'
            });
            core.setFailed('hexo generate failed; see commit comment for log');

      - name: Deploy to gh-pages
        if: steps.generate.outcome == 'success'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          force_orphan: true
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: 'deploy: ${{ github.sha }}'
